[package]
name = "formatico-cli"
version = "0.3.0"
edition = "2021"
description = "Format and convert structured text from the command line"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4"

[[bin]]
name = "fmt"
path = "src/main.rs"

[[bench]]
name = "parse"
harness = false

[profile.release]
lto = true
codegen-units = 1
