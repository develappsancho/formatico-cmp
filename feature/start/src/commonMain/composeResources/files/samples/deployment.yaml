# A web service and its worker: they share their labels, environment and resources through anchors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formatico-web
  namespace: tools
  labels: &labels
    app: formatico
    tier: web
spec:
  replicas: 3
  selector:
    matchLabels: *labels
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: web
          image: registry.example.com/formatico/web:1.4.2
          ports:
            - name: http
              containerPort: 8080
          env: &env
            - name: LOG_LEVEL
              value: info
            - name: MAX_UPLOAD_MB
              value: "50"
          resources: &resources
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
        - name: worker
          image: registry.example.com/formatico/worker:1.4.2
          args: ["--queue", "conversions", "--concurrency", "4"]
          env: *env
          resources: *resources
