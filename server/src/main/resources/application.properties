# Formatico's server, in Docker behind nginx.
spring.application.name=formatico-server
server.port=8080
spring.main.banner-mode=off

# The shares' folder, which the server's user owns: FORMATICO_SHARES_DIRECTORY in the environment.
formatico.shares.directory=/data/shares
# The most the shares hold together, on a disk the host shares with other applications, and how many an address
# leaves a day. Past either, a share is refused: 507, and 429 with "daily-limit".
formatico.shares.max-total=5GB
formatico.shares.per-address-per-day=50
# The origins a browser may call the API from: the web app's own too, as the server, behind nginx and Traefik, sees
# neither the scheme nor the port the browser used. FORMATICO_ALLOWEDORIGINS in the environment, comma separated.
formatico.allowed-origins=https://formatico.pantrixui.com
# The fetch reaches public addresses on ports 80 and 443 only. Only the tests turn this on.
formatico.fetch.allow-private=false

# A share is written to disk as it comes, and never held whole; the codecs may hold one share all the same.
spring.http.codecs.max-in-memory-size=11MB
# Never a request's details, which hold the address a fetch asks, in the logs.
spring.http.codecs.log-request-details=false
