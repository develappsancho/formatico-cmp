# Formatico's web app in nginx: its files, and Formatico's server at /api, which only nginx reaches.
#
# The app keeps its place after the address's `#` (#start, #document?id=3, a shared link's #d= or #s=), which no
# browser sends: every page is index.html, and a key in a link never reaches nginx or the server.

# How long a browser keeps a file. A file named by a hash of what it holds never changes, since a new build gives it a
# new name: it is kept for a year. Any other file is asked for again each time, and answered "not modified" while it
# is the same, so a new build is seen at once.
map $uri $formatico_cache {
    "~^/[0-9a-f]{16,}\.wasm$" "public, max-age=31536000, immutable";
    default                   "no-cache";
}

# How often an address may ask the server: to keep a share, a few times a second; to fetch a web address, as often.
# What comes past that nginx answers itself, 429, and the server never sees it.
limit_req_zone $binary_remote_addr zone=formatico_shares:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=formatico_fetch:10m rate=2r/s;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # The address a request comes from is the visitor's, not that of the proxy in front of the stack (Coolify's
    # Traefik), which writes the visitor's into X-Forwarded-For: an address of a private network is a proxy's.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip_static on;
    gzip_vary on;

    add_header Cache-Control $formatico_cache always;
    add_header X-Content-Type-Options nosniff always;
    # A shared link's key is after its `#`, which no browser sends on; no address at all is sent on from here.
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The server, looked up at each request through Docker's own DNS, so that nginx starts while it is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $formatico_server http://server:8080;
        proxy_pass $formatico_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
        client_max_body_size 1k;
        proxy_read_timeout 30s;
    }

    # A share of 10 MB at the most, encrypted: a little more than that, and what its form adds.
    location /api/shares {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $formatico_server http://server:8080;
        proxy_pass $formatico_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        limit_req zone=formatico_shares burst=10 nodelay;
        limit_req_status 429;
    }

    # A web address, fetched by the server for a browser, which may not read another site itself. Its address is in the
    # query, and what someone opened is theirs: no log of it is kept.
    location = /api/fetch {
        access_log off;
        # The error log writes the request's line too, the address with it: a request refused by the rate limit, or a
        # server that does not answer, is logged at `error`. Only what is critical is kept here.
        error_log /dev/stderr crit;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $formatico_server http://server:8080;
        proxy_pass $formatico_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
        client_max_body_size 1k;
        proxy_read_timeout 30s;
        limit_req zone=formatico_fetch burst=10 nodelay;
        limit_req_status 429;
    }
}
