# The headers every answer of Formatico's nginx carries. They are included in the server and in each location that
# adds a header of its own, as nginx takes a location's add_header in place of the server's, never beside it. The
# browser tests (app/webTest) serve the web app with these same lines: a page they pass is a page this policy lets run.
add_header X-Content-Type-Options nosniff always;
# A shared link's key is after its `#`, which no browser sends on; no address at all is sent on from here.
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
# What the page may load and run: its own files, compiled into WebAssembly (both builds draw with Skia's Wasm), and its
# own server for the rest. Compose writes a <style> into the root of its own it draws in, which takes 'unsafe-inline'
# for styles; nothing takes it for scripts. A document at a web address is fetched through /api/fetch. The one other
# site the page reaches is a picture's, over https, for the thumbnail of a value that is its address, as the other
# platforms read it (connect-src https:, the owner's decision, 2026-11-12): only a site that lets a page read it (CORS)
# gives one, and a picture of any other keeps its icon.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
