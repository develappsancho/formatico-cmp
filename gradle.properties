#Kotlin
kotlin.code.style=official
# Every target's tests compiled at once, as the full check does, ran Wasm's compiler out of 3 GB.
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Formatico
# Formatico's version: Android's versionName, the desktop's package, and what Settings' About says.
formatico.version=1.0.0
