# Settings, from Start: Turkish is chosen and the app speaks it at once; the dark theme is chosen too. Then the
# system's language is chosen again, and the app speaks the device's, English.
appId: ${APP_ID}
name: Settings changes the language and the theme
---
- launchApp:
    clearState: true
    stopApp: true
- tapOn:
    id: "IconButton_settings"
- extendedWaitUntil:
    visible: "Indentation"
    timeout: 10000
- tapOn:
    id: "Select_language"
- tapOn:
    id: ".*SelectOption_tr"
- extendedWaitUntil:
    visible: "Dil"
    timeout: 10000
- tapOn:
    id: ".*Segment_dark"
- takeScreenshot: ${SHOTS}/settings
- tapOn:
    id: ".*IconButton_back"
- assertVisible: "Ne varsa yapıştır"
- tapOn:
    id: "IconButton_settings"
- tapOn:
    id: "Select_language"
- tapOn:
    id: ".*SelectOption_system"
- extendedWaitUntil:
    visible: "Language"
    timeout: 10000
- tapOn:
    id: ".*IconButton_back"
- assertVisible: "Paste anything"
